name: Publish existing desktop packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop packages run ID
        required: true
      tag:
        description: Existing release tag
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: xeck-*
          path: release-assets
          merge-multiple: true
      - name: Upload packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
