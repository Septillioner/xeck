name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host/package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Poyraz dependencies
        run: npm ci --prefix poyraz

      - name: Build Poyraz
        run: npm run build:lib

      - name: Install host dependencies
        run: npm ci --prefix host

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Test
        run: npm test

      - name: Build desktop components
        run: npm run build:desktop
